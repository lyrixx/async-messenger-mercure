# Templates to factorize the service definitions
x-templates:
    worker_base: &worker_base
        build:
            context: services/php
            target: worker
        user: "${USER_ID}:${USER_ID}"
        environment:
            - APP_ENV
            - MERCURE_URL=http://frontend/.well-known/mercure
            - MERCURE_PUBLIC_URL=https://${PROJECT_ROOT_DOMAIN}/.well-known/mercure
            - MERCURE_PUBLISHER_JWT_KEY=!ChangeThisMercureHubJWTSecretKey!
        volumes:
            - "../..:/var/www:cached"
        # Don't use depends_on, it does not work well with docker compose profiles
        profiles:
            - worker

volumes:
    postgres-data: {}

services:
    postgres:
        image: postgres:16
        environment:
            - POSTGRES_USER=app
            - POSTGRES_PASSWORD=app
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default

    frontend:
        build:
            context: services/php
            target: frontend
        user: "${USER_ID}:${USER_ID}"
        environment:
            SERVER_NAME: ${PROJECT_ROOT_DOMAIN}
            MERCURE_URL: http://frontend/.well-known/mercure
            MERCURE_PUBLIC_URL: https://${PROJECT_ROOT_DOMAIN}/.well-known/mercure
            MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            postgres:
                condition: service_healthy
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.rule=Host(${PROJECT_DOMAINS})"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.tls=true"
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.rule=Host(${PROJECT_DOMAINS})"
            # Comment the next line to be able to access frontend via HTTP instead of HTTPS
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.middlewares=redirect-to-https@file"
            - "traefik.http.services.${PROJECT_NAME}-frontend.loadbalancer.server.port=80"

    worker_messenger:
        <<: *worker_base
        command: php -d memory_limit=1G /var/www/bin/console messenger:consume async --memory-limit=128M -vv

    builder:
        build:
            context: services/php
            target: builder
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            - APP_ENV
            - MERCURE_URL=http://frontend/.well-known/mercure
            - MERCURE_PUBLIC_URL=https://${PROJECT_ROOT_DOMAIN}/.well-known/mercure
            - MERCURE_PUBLISHER_JWT_KEY=!ChangeThisMercureHubJWTSecretKey!
            - PHP_CS_FIXER_IGNORE_ENV=1
            - GITHUB_ACTIONS
            - CI # Travis CI, CircleCI, Cirrus CI, Gitlab CI, Appveyor, CodeShip, dsari
            - BUILD_NUMBER # Jenkins, TeamCity
            - RUN_ID # TaskCluster, dsari
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            - postgres
        profiles:
            - builder
